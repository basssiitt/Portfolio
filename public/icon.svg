<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05060A"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="rgba(255, 255, 255, 0.2)"/>

  <!-- Sleek Glowing Monogram "A" with Cyan-Violet Core -->
  <g filter="url(#glow)">
    <path d="M32 14L46 48H39.5L36.5 40.5H27.5L24.5 48H18L32 14Z" fill="url(#brandGrad)"/>
    <polygon points="32,22 29.2,34 34.8,34" fill="#05060A"/>
    <circle cx="32" cy="30" r="1.5" fill="#00E5FF"/>
  </g>
</svg>
